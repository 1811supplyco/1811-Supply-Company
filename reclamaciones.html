<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro de Reclamaciones - 1811 Supply Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; }
        .input-field { width: 100%; background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; color: white; font-size: 12px; outline: none; margin-bottom: 16px; }
        .input-field:focus { border-color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <nav class="p-4 md:p-6 border-b border-white/5 sticky top-0 bg-[#0a0a0a] z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html"><img src="logo2.png" alt="1811 Logo" class="h-10 md:h-16 w-auto object-contain"></a>
            <a href="index.html" class="text-[9px] font-black uppercase tracking-widest text-white border border-white/10 px-4 py-2 hover:bg-white hover:text-black">VOLVER A LA TIENDA</a>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-12 max-w-2xl flex-1">
        <div class="mb-10 text-center md:text-left">
            <h1 class="text-[20px] md:text-[28px] font-black text-white uppercase tracking-widest">LIBRO DE RECLAMACIONES</h1>
            <div class="h-[1px] w-12 bg-white/20 mt-4 mx-auto md:mx-0"></div>
        </div>

        <div id="mensaje-exito" class="hidden mb-6 p-4 border border-green-500 text-green-500 text-[10px] font-black uppercase tracking-widest text-center">
            RECLAMO ENVIADO CORRECTAMENTE. TE CONTACTAREMOS PRONTO.
        </div>

        <form id="formulario-reclamo" class="flex flex-col">
            <h2 class="text-[10px] font-black text-white uppercase tracking-widest mb-4 border-b border-white/10 pb-2">1. Identificación del Consumidor</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Nombres y Apellidos</label><input type="text" name="nombres" required class="input-field"></div>
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">DNI / CE</label><input type="text" name="dni" required class="input-field"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Correo Electrónico</label><input type="email" name="correo" required class="input-field"></div>
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Teléfono</label><input type="tel" name="telefono" required class="input-field"></div>
            </div>
            <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Dirección</label><input type="text" name="direccion" required class="input-field">

            <h2 class="text-[10px] font-black text-white uppercase tracking-widest mt-6 mb-4 border-b border-white/10 pb-2">2. Identificación del Bien Contratado</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Producto o Servicio</label><input type="text" name="producto" required class="input-field"></div>
                <div><label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Monto Reclamado (S/)</label><input type="number" step="0.01" name="monto" required class="input-field"></div>
            </div>
            <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Descripción del producto</label><input type="text" name="descripcion" required class="input-field">

            <h2 class="text-[10px] font-black text-white uppercase tracking-widest mt-6 mb-4 border-b border-white/10 pb-2">3. Detalle de la Reclamación</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Detalle de la Reclamación (Tipo)</label>
                    <div class="flex gap-4 mb-4">
                        <label class="text-[10px] text-gray-300 flex items-center gap-2"><input type="radio" name="tipo" value="Reclamo" required> Reclamo</label>
                        <label class="text-[10px] text-gray-300 flex items-center gap-2"><input type="radio" name="tipo" value="Queja" required> Queja</label>
                    </div>
                </div>
                <div>
                    <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Fecha del Suceso</label>
                    <input type="date" name="fecha" required class="input-field">
                </div>
            </div>
            
            <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Detalle de la queja/reclamo</label>
            <textarea name="detalle_texto" rows="4" required class="input-field resize-none"></textarea>
            
            <label class="block text-[9px] font-bold text-gray-400 uppercase mb-2">Pedido (Solución esperada)</label>
            <textarea name="pedido" rows="2" required class="input-field resize-none"></textarea>

            <button type="submit" id="btn-enviar" class="mt-6 w-full bg-white text-black py-4 text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all">
                ENVIAR RECLAMO
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('formulario-reclamo');
        const btn = document.getElementById('btn-enviar');
        const mensaje = document.getElementById('mensaje-exito');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            btn.innerText = 'ENVIANDO...';
            btn.disabled = true;

            const data = new URLSearchParams(new FormData(form));

            fetch('https://script.google.com/macros/s/AKfycbz3XJvTd-rmac9CX9494HlVCdbGze-s66KbqioMhC9cVSky75U07rwIjCxSIJn4z1Bdlg/exec', {
                method: 'POST',
                body: data
            })
            .then(res => {
                form.reset();
                form.classList.add('hidden');
                mensaje.classList.remove('hidden');
            })
            .catch(error => {
                alert('Hubo un error al enviar. Por favor intenta de nuevo.');
                btn.innerText = 'ENVIAR RECLAMO';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
